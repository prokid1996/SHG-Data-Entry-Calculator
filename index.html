<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHG Data Entry & Calculator</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
<h1>சுய உதவிக் குழு - Data Entry & Calculator</h1>
<p>20 உறுப்பினர்கள்</p>
</header>

<section class="buttons">
<button onclick="saveData()">💾 Save</button>
<button onclick="loadData()">↻ Load</button>
<button onclick="window.print()">🖨️ Print</button>
<button class="danger" onclick="clearData()">Clear</button>
</section>

<section class="table-box">
<table id="shgTable">
<thead><tr>
<th>#</th><th>உறுப்பினர் பெயர்</th><th>இதுவரை<br>வரவு</th><th>இம்மாதம்<br>வரவு</th>
<th>மொத்தம்<br>சேமிப்பு</th><th>பெற்றுள்ள<br>கடன்</th><th>செலுத்திய<br>தவணை</th>
<th>பெற்ற<br>கடன்</th><th>இம்மாதம்<br>தவணை</th><th>கடன்<br>பாக்கி</th>
<th>வட்டி<br>வரவு</th><th>இம்மாதம்<br>வட்டி</th><th>மொத்த<br>வரவு</th>
</tr></thead>
<tbody id="memberRows"></tbody>
<tfoot><tr>
<th colspan="2">மொத்தம்</th>
<th id="total2">0</th><th id="total3">0</th><th id="total4">0</th>
<th id="total5">0</th><th id="total6">0</th><th id="total7">0</th>
<th id="total8">0</th><th id="total9">0</th><th id="total10">0</th>
<th id="total11">0</th><th id="total12">0</th>
</tr></tfoot>
</table>
</section>

<section class="result">
<h2>மொத்த முடிவு</h2>
<div id="summary"></div>
</section>

<script src="./script.js"></script>
</body>
</html>
